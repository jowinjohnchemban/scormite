server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hash-named Vite bundles can be cached indefinitely. The service worker and
  # shell must be revalidated so new releases take effect promptly.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # The application is a client-side SPA. Static files still take precedence.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
