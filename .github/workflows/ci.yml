name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (includes architecture boundaries)
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests with coverage thresholds
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

  e2e:
    name: Playwright e2e (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Microsoft's Playwright image ships Chromium and its system libraries, so
    # the job never waits on Ubuntu's package mirrors (apt). Keep the tag on the
    # @playwright/test version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # A no-op while the image matches @playwright/test; if the package is
        # ahead of the image, this downloads only the browser, not system packages.
        run: pnpm exec playwright install chromium

      - name: Run e2e suite
        run: pnpm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
