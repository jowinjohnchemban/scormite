name: Prepare release

# Run from the Actions tab to start a release. It works out the next version
# from the Conventional Commits since the last tag (or takes the bump you
# choose), updates package.json and moves CHANGELOG.md's Unreleased notes
# under that version on a release/vX.Y.Z branch, and links a pull request to
# open. Merging that pull request publishes the release (release.yml).
#
# The pull request is opened by a person, not by this workflow: checks do not
# run on pull requests opened with the workflow's token, and main requires them.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

concurrency:
  group: prepare-release

jobs:
  prepare:
    name: Prepare the release branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bump the version and the changelog
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$BUMP" = auto ]; then version=$(node build/release.ts); else version=$(node build/release.ts "$BUMP"); fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Push the release branch
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Never replace a release branch: it may carry changes from its review.
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::error::$branch already exists. Merge or close its pull request (and delete the branch) before preparing v$VERSION again."
            exit 1
          fi
          git switch -c "$branch"
          git commit -am "chore(release): v$VERSION"
          git push origin "$branch"
          title="chore(release): v$VERSION"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1&title=$(node -p 'encodeURIComponent(process.argv[1])' "$title")"
          {
            echo "## Release v$VERSION is ready"
            echo
            echo "**[Open the pull request]($url)**, check the version and the changelog, and merge it when the checks pass: the release is then published automatically."
            echo
            echo '### Release notes'
            echo
            node build/releaseNotes.ts "v$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Release v$VERSION::Open the pull request: $url"
