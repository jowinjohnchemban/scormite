<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevTools for your SCORM package. Drop a .zip and Scormite runs it locally — live API transcript, CMI inspector, timeline replay, breakpoints, validation, and runtime profiles. No upload. No account." />
    <title>Scormite</title>

    <!-- Preload critical resources for faster initial paint -->
    <link rel="modulepreload" href="/src/main.tsx" />
    <link rel="preload" as="style" href="/src/index.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Preloader styles (inline to avoid FOUC) -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0d10;
        z-index: 9999;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      #preloader.hidden {
        opacity: 0;
        visibility: hidden;
      }
      .preloader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #2a3038;
        border-top-color: #4da3ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .preloader-text {
        position: absolute;
        bottom: 60px;
        left: 50%;
        transform: translateX(-50%);
        color: #7f93ab;
        font-size: 13px;
        font-family: system-ui, -apple-system, sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Preloader shown until React hydrates -->
    <div id="preloader" role="status" aria-label="Loading SCORMite">
      <div class="preloader-spinner" aria-hidden="true"></div>
      <span class="preloader-text">Loading SCORMite…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
