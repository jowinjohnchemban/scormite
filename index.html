<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <title>SCORMite</title>
    <!-- Vite injects modulepreload / stylesheet links for the built chunks. -->

    <!-- Preloader styles (inline to avoid FOUC) -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0d10;
        z-index: 9999;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      #preloader.hidden {
        opacity: 0;
        visibility: hidden;
      }
      .preloader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #2a3038;
        border-top-color: #4da3ff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .preloader-text {
        position: absolute;
        bottom: 60px;
        left: 50%;
        transform: translateX(-50%);
        color: #7f93ab;
        font-size: 13px;
        font-family: system-ui, -apple-system, sans-serif;
      }
      /* Crawlable fallback inside #root (rendered by build/seoPlugin.ts);
         React replaces it on mount. Readable on its own without JS. */
      .seo-fallback {
        max-width: 48rem;
        margin: 0 auto;
        padding: 2rem 1rem;
        color: #c9d1d9;
        background: #0b0d10;
        font: 14px/1.6 system-ui, -apple-system, sans-serif;
      }
      .seo-fallback h1 { font-size: 1.5rem; color: #f0f6fc; }
      .seo-fallback h2 { font-size: 1.125rem; margin-top: 2rem; color: #f0f6fc; }
      .seo-fallback h3 { font-size: 1rem; margin: 0; color: #f0f6fc; }
      .seo-fallback dt { font-weight: 600; margin-top: 1rem; color: #f0f6fc; }
      .seo-fallback dd { margin: 0.25rem 0 0; }
    </style>
    <noscript><style>#preloader { display: none; }</style></noscript>
  </head>
  <body>
    <!-- Preloader shown until React hydrates -->
    <div id="preloader" role="status" aria-label="Loading SCORMite">
      <div class="preloader-spinner" aria-hidden="true"></div>
      <span class="preloader-text">Loading SCORMite…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
